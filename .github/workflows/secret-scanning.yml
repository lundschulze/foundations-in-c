name: Secret scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"

          curl --fail --location --silent --show-error \
            "$release_url" --output "$archive_path"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive_path" \
            | sha256sum --check --strict
          tar -xzf "$archive_path" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan all reachable commits
        run: ./scripts/scan-secrets.sh
